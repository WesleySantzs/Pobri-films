<!DOCTYPE html>
<html lang="pt-BR">

    <title>Netflix Clone</title>

            margin: 0;
            padding: 0;
            box-sizing: border-box;

        body {

        }

        /* Navbar */
        .navbar {
            position: fixed;
            top: 0;
            width: 100%;
            padding: 20px 4%;

            align-items: center;
            z-index: 1000;
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 10%, transparent);
            transition: background-color 0.4s;
        }

        .navbar.scrolled {
            background-color: #141414;
        }

            align-items: center;
            gap: 25px;
        }

        }

        .nav-links {

            gap: 20px;
        }

            text-decoration: none;
            font-size: 14px;
            transition: color 0.3s;
        }

            color: #b3b3b3;
        }

            gap: 20px;
        }

            cursor: pointer;
            font-size: 20px;
